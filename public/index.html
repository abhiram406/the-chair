    <div class="ripple" aria-hidden="true"><div>Today</div><div>Months later</div><div>After you’ve gone</div></div>
  </section>
  ${saved && saved.phase !== 'end' && saved.phase !== 'setup' ? `
  <div class="resume">
    <p style="margin:0 0 .6rem"><b>Game in progress:</b> ${esc(saved.role)} of ${esc(saved.name)}, decision ${saved.turn+1} of ${saved.total}.</p>
    <div class="row"><button class="btn" data-act="resume">Resume game</button><button class="btn ghost" data-act="discard">Discard it</button></div>
  </div>` : ''}
  <div class="setup-grid">
    <fieldset>
      <legend>Your role</legend>
      <p class="hint">Pick the seat you’re training for.</p>
      <div class="choices">
        ${Object.entries(ROLES).map(([k,r]) => `<button class="choice" data-act="set" data-k="role" data-v="${k}" aria-pressed="${sel('role',k)}"><b>${esc(r.full)}</b><span>${esc(r.blurb)}</span></button>`).join('')}
      </div>
    </fieldset>
    <fieldset>
      <legend>Industry</legend>
      <p class="hint">Scenarios are written for this industry.</p>
      <div class="pills">
        ${DOMAINS.concat('Other').map(d => `<button class="pill" data-act="set" data-k="domain" data-v="${esc(d)}" aria-pressed="${sel('domain',d)}">${esc(d)}</button>`).join('')}
      </div>
      ${draft.domain === 'Other' ? `<label class="field"><span>Describe the industry</span><input id="dom-other" maxlength="80" placeholder="For example: craft breweries, satellite imaging, legal services" value="${esc(draft.customDomain)}"></label>` : ''}
      ${draft.domain === 'Other' && !aiOn ? '<p class="hint" style="margin-top:.5rem">Built-in scenarios are general, so a custom industry mainly shapes the AI-written ones.</p>' : ''}
    </fieldset>
    <fieldset>
      <legend>Company size</legend>
      <p class="hint">Bigger companies have more cash but move more slowly; startups move fast and can run out of money.</p>
      <div class="choices">
        ${Object.entries(SIZES).map(([k,s]) => `<button class="choice" data-act="set" data-k="size" data-v="${k}" aria-pressed="${sel('size',k)}"><b>${s.label}</b><span>${s.desc}</span></button>`).join('')}
      </div>
    </fieldset>
    <fieldset>
      <legend>Timeframe</legend>
      <p class="hint">Longer tenures let you see your own long-term consequences land. Shorter ones show what you leave for the next person.</p>
      <div class="choices">
        ${Object.entries(TFS).map(([k,t]) => `<button class="choice" data-act="set" data-k="tf" data-v="${k}" aria-pressed="${sel('tf',k)}"><b>${t.label}</b><span>${t.desc}</span></button>`).join('')}
      </div>
    </fieldset>
    <fieldset>
      <legend>Company name</legend>
      <label class="field" style="margin-top:.4rem"><span class="muted small" style="font-weight:400">Optional. Leave blank for a random one.</span><input id="co-name" maxlength="40" placeholder="For example: Kestrel" value="${esc(draft.name)}"></label>
    </fieldset>
    <fieldset>
      <legend>Scenarios</legend>
      <p class="hint" id="ai-status">${aiStatus === 'checking' ? 'Checking whether the AI server is available…' : aiOn ? `Scenarios will be written by ${esc(AI.model || 'your AI model')} through your server.` : 'The AI server isn’t reachable or has no API key set, so the built-in library will be used.'}</p>
      <div class="choices">
        <button class="choice" data-act="set" data-k="source" data-v="ai" aria-pressed="${sel('source','ai')}" ${aiOn ? '' : 'disabled'}><b>Written by AI</b><span>Fresh, industry-specific dilemmas that react to your numbers. You can also write your own decisions and ask a mentor.</span></button>
        <button class="choice" data-act="set" data-k="source" data-v="bank" aria-pressed="${sel('source','bank')}"><b>Built-in library</b><span>37 leadership dilemmas with real case studies, 25 of them with several levers to pull at once. Works instantly, no usage needed.</span></button>
      </div>
      ${aiOn && AI.needsCode && draft.source === 'ai' ? `<label class="field"><span>Access code</span><input class="codein" type="password" autocomplete="off" placeholder="Ask whoever runs this game" value="${esc(getCode())}"></label>` : ''}
    </fieldset>
  </div>
  <div class="startbar" style="margin-top:2rem">
    <button class="btn" data-act="start" ${aiStatus === 'checking' && draft.source === 'ai' ? 'disabled' : ''}>Take the chair</button>
    <span class="muted small">${esc(ROLES[draft.role].short)} of a ${SIZES[draft.size].label.toLowerCase()} for ${TFS[draft.tf].label}</span>
  </div>`;
}

function metricsHTML(){
  const m = S.m, ref = S.phase === 'outcome' ? S.mark : S.markPrev, rw = runway(m);
  const d = (k, pct) => {
    const a = m[k], b = ref[k];
    if (pct){ if (!b) return ''; const c = (a/b - 1)*100; if (Math.abs(c) < .5) return ''; return `<span class="mdelta ${c > 0 ? 'up' : 'down'}">${sgn(c)}%</span>`; }
    const c = a - b; if (Math.abs(c) < .5) return '';
    const good = k === 'debt' ? c < 0 : c > 0;
    return `<span class="mdelta ${good ? 'up' : 'down'}">${sgn(c)}</span>`;
  };
  const bar = (v, inv) => { const g = inv ? 100 - v : v; return `<div class="bar"><i class="${g >= 55 ? 'ok' : g >= 35 ? 'warn' : 'risk'}" style="width:${clamp(v,0,100)}%"></i></div>`; };
  const tile = (term, label, val, delta, extra='') => `<button class="metric" data-act="term" data-term="${esc(term)}"><span class="mlabel">${label}</span><span class="mval">${val}</span>${delta}${extra}</button>`;
  return `<h2>Company dashboard</h2><div class="mgrid">
    ${tile('Annual revenue','Yearly revenue', money(m.rev), d('rev',true))}
    ${tile('Cash','Cash', money(m.cash), d('cash',true))}
    ${tile('Runway','Runway', rw === null ? 'Profitable' : Math.round(rw) + ' mo', '', rw !== null ? bar(clamp(rw/36*100,0,100)) : '')}
    ${tile('Growth rate','Growth per year', m.growth.toFixed(0) + '%', d('growth'))}
    ${tile('Profit margin','Profit margin', m.margin.toFixed(0) + '%', d('margin'))}
    ${tile('Headcount','Headcount', num(m.staff), d('staff',true))}
    ${tile('Team morale','Team morale', Math.round(m.morale), d('morale'), bar(m.morale))}
    ${tile('Customer satisfaction','Customer satisfaction', Math.round(m.sat), d('sat'), bar(m.sat))}
    ${tile('Tech debt','Tech debt', Math.round(m.debt), d('debt'), bar(m.debt, true))}
    ${tile('Reputation','Reputation', Math.round(m.rep), d('rep'), bar(m.rep))}
    ${tile('Board confidence','Board confidence', Math.round(m.board), d('board'), bar(m.board))}
  </div>
  <button class="valuebox" data-act="term" data-term="Valuation"><span class="mlabel">Estimated company value</span><span class="mval">${money(valuation(m))}</span><span class="mlabel">Started at ${money(valuation(S.start))}</span></button>
  ${S.drift && S.drift.length && S.phase !== 'outcome' ? `<div class="drift">${S.drift.map(n => `<p>${esc(n)}</p>`).join('')}</div>` : ''}`;
}

function timelineHTML(){
  const slots = [];
  for (let i = 0; i < S.total; i++){
    const cls = i < S.turn ? 'past' : i === S.turn ? 'now' : 'future';
    const ps = S.pending.filter(p => p.due === i);
    slots.push(`<li class="slot ${cls}" title="${esc(periodLabel(i))}"><span class="tick">${i === S.turn ? 'Now' : i+1}</span><span class="dots">${ps.map(p => `<i class="dot ${p.h === 'medium' ? 'med' : 'long'}"></i>`).join('')}</span></li>`);
  }
  const after = S.pending.filter(p => p.due >= S.total);
  slots.push(`<li class="slot after" title="After your tenure ends"><span class="tick">After you</span><span class="dots">${after.map(p => `<i class="dot ${p.h === 'medium' ? 'med' : 'long'}"></i>`).join('')}</span></li>`);
  return `<ol class="track" style="--n:${S.total}" aria-label="Timeline of decisions and pending consequences">${slots.join('')}</ol>
  <p class="legend"><span><i class="dot med"></i>Medium-term consequence on its way</span><span><i class="dot long"></i>Long-term consequence on its way</span></p>`;
}

function renderGame(){
  const role = ROLES[S.role];
  app.innerHTML = `
  <section class="status">
    <span class="co">${esc(S.name)}, ${esc(SIZES[S.size].label.toLowerCase())} in ${esc(S.domain)}</span>
    <h1 class="period">${esc(periodLabel(S.turn))}</h1>
    <p class="sub">Decision ${S.turn+1} of ${S.total} as ${esc(role.short)}. Each decision covers ${dur(1)}.</p>
    ${timelineHTML()}
  </section>
  <div class="cols">
    <aside class="metrics">${metricsHTML()}</aside>
    <section class="stage">${stageHTML()}</section>
  </div>`;
  const ta = $('#cd'); if (ta) ta.value = S.customDraft || '';
}

function stageHTML(){
  if (S.phase === 'loading'){
    return `<div class="loading" aria-live="polite"><div class="pulse"><i></i><i></i><i></i></div>
      <p style="margin:0 0 .3rem;font-weight:700">${S.turn === 0 ? 'Drafting your first briefing' : 'Drafting your next briefing'}</p>
      <p class="muted small" id="busy-line" style="margin:0 0 1rem">This usually takes 10 to 40 seconds.</p>
      ${busy ? '<button class="btn ghost" data-act="tobank">Use a built-in scenario instead</button>' : ''}</div>`;
  }
  if (S.phase === 'error'){
    return `<div class="errbox" role="alert"><p style="margin:0 0 .8rem">${esc(S.error)}</p>
      ${S.errorCode === 'needs_code' ? `<label class="field" style="margin:0 0 .8rem"><span>Access code</span><input class="codein" type="password" autocomplete="off" value="${esc(getCode())}"></label>` : ''}
      <div class="row"><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="bankonce">Use a built-in scenario</button></div></div>`;
  }
  if (S.phase === 'outcome') return outcomeHTML();
  const sc = S.scenario, ai = S.source === 'ai' && sample;
  const landed = S.landed && S.landed.length ? `<div class="landed"><h3>Consequences landing now</h3>${S.landed.map(p => `<div class="item ${p.h}"><p class="from">${p.h === 'medium' ? 'Medium-term' : 'Long-term'} effect of “${esc(p.from)}”</p><p>${esc(p.note)}</p>${chips(p.e)}</div>`).join('')}</div>` : '';
  const evaluating = S.phase === 'evaluating';
  return `
  ${S.notice ? `<p class="notice">${esc(S.notice)}</p>` : ''}
  ${landed}
  <article>
    <p class="kind">${esc(sc.type)}</p>
    <h2 class="title">${esc(sc.title)}</h2>
    <div class="prose">${sc.situation.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    ${sc.stakeholders.length ? `<ul class="stakes">${sc.stakeholders.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}
    ${sc.glossary.length ? `<details class="terms-d"><summary>Terms in this briefing (${sc.glossary.length})</summary><dl class="terms">${sc.glossary.map(g => `<dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd>`).join('')}</dl></details>` : ''}
    ${sc.analogy ? `<div class="analogy"><h4>Think of it like this</h4><p>${esc(sc.analogy)}</p></div>` : ''}
    <h3 class="dh">Your decision</h3>
    ${evaluating ? `<div class="loading" style="padding:1rem 0" aria-live="polite"><div class="pulse"><i></i><i></i><i></i></div><p style="margin:0;font-weight:700">The board is weighing your plan</p><p class="muted small" id="busy-line" style="margin:.2rem 0 0">Working out what happens next.</p></div>` : `
    ${sc.levers ? leversHTML(sc) : ''}
    <div>${sc.options.map((x,i) => `<button class="opt" data-act="choose" data-i="${i}"><span class="olabel">${esc(x.label)}</span>${x.detail ? `<span class="odetail">${esc(x.detail)}</span>` : ''}</button>`).join('')}</div>
    ${ai ? `<div class="custom">
      <label for="cd">${sc.levers ? 'Or ignore the levers and write your own plan' : 'Or write your own decision'}</label>
      <p class="muted small" style="margin:0">Real executives rarely get a neat menu. Describe what you’d do, who does it, by when, and with what money.</p>
      <textarea id="cd" maxlength="2000" placeholder="For example: Offer the customer a paid pilot of a general version, staffed by two engineers for six weeks, and…"></textarea>
      ${S.customError ? `<p class="small" style="color:var(--bad);margin:0 0 .5rem">${esc(S.customError)}</p>` : ''}
      <button class="btn" data-act="custom">Commit this decision</button>
    </div>
    <details class="mentor" ${S.mentorOpen ? 'open' : ''} data-mentor>
      <summary>Ask a mentor</summary>
      <p class="muted small" style="margin:.2rem 0 .4rem">Ask about a term, a tradeoff, or how an experienced ${esc(ROLES[S.role].short)} would think about this. The mentor won’t pick for you.</p>
      ${sc.mentor.map((qa,i) => `<div class="qa"><div class="q">${esc(qa.q)}</div><div class="a" id="ma-${i}">${qa.a ? esc(qa.a) : (qa.state === 'pending' ? '<span class="muted">Thinking…</span>' : '')}</div>${qa.state === 'error' ? `<p class="small" style="color:var(--bad);margin:.2rem 0 0">${esc(qa.err)}</p>` : ''}</div>`).join('')}
      <div class="qrow"><input id="mq" maxlength="400" placeholder="What does dilution mean for me here?" value="${esc(S.mentorDraft)}" aria-label="Your question for the mentor"><button class="btn" data-act="ask">Ask</button></div>
    </details>` : ''}`}
  </article>`;
}

function outcomeHTML(){
  if (S.outcome && S.outcome.levers) return leverOutcomeHTML();
  const { opt, custom } = S.outcome, tf = TFS[S.tf], sc = S.scenario;
  const lastTurn = S.turn + 1 >= S.total;
  const when = n => S.turn + n >= S.total ? `After you’ve left (about ${dur(n)} from now)` : `In ${dur(n)}`;
  const others = custom ? sc.options : sc.options.filter(x => x !== opt && x.label !== opt.label);
  return `
  <article>
    <p class="kind">${custom ? 'Your own decision' : 'Decision made'}</p>
    <h2 class="title">${esc(opt.label)}</h2>
    ${custom && opt.feedback ? `<p class="feedback">${esc(opt.feedback)}</p>` : ''}
    <div class="wave now"><h4>Right away</h4><p>${esc(opt.short.note)}</p>${chips(opt.short.e)}</div>
    <div class="wave med"><h4>${when(tf.med)}</h4><p>${esc(opt.medium.note)}</p><p class="sealed">The exact effects are revealed when this lands.</p></div>
    <div class="wave long"><h4>${when(tf.long)}</h4><p>${esc(opt.long.note)}</p><p class="sealed">${S.turn + tf.long >= S.total ? 'This lands after your tenure. It still counts toward your legacy score.' : 'The exact effects are revealed when this lands.'}</p></div>
    ${opt.lesson ? `<div class="lesson"><h4>The lesson</h4><p>${esc(opt.lesson)}</p></div>` : ''}
    ${sc.caseStudy ? `<div class="case"><h4>Case study: ${esc(sc.caseStudy.company)}${sc.caseStudy.year ? ` (${esc(sc.caseStudy.year)})` : ''}</h4><p>${esc(sc.caseStudy.summary)}</p>${sc.src === 'ai' ? '<p class="tag">Written by AI from memory. Worth checking the details before you quote it.</p>' : ''}</div>` : ''}
    ${others.length ? `<details class="paths"><summary>How the other paths would have played out</summary>
      ${others.map(x => `<div class="path"><p><b>${esc(x.label)}</b></p><p><span class="muted">Right away:</span> ${esc(x.short.note)}</p><p><span class="muted">Medium term:</span> ${esc(x.medium.note)}</p><p><span class="muted">Long term:</span> ${esc(x.long.note)}</p></div>`).join('')}
    </details>` : ''}
    <div class="next"><button class="btn" data-act="advance">${lastTurn ? 'Finish and see your review' : 'Move on to ' + esc(periodLabel(S.turn + 1).toLowerCase())}</button></div>
  </article>`;
}

function reviewHTML(t){
  return String(t).split(/\n\s*\n|\n/).filter(x => x.trim()).map(p => {
    const mm = p.match(/^\s*(Overall|Strengths|Blind spots|Practice next)\s*:\s*/i);
    return mm ? `<p><b>${esc(mm[1])}:</b> ${esc(p.slice(mm[0].length))}</p>` : `<p>${esc(p)}</p>`;
  }).join('');
}

function renderEnd(){
  const s = S.start, m = S.m, lm = S.legacyM, role = ROLES[S.role];
  const pct = (a,b) => { const c = (a/b - 1)*100; return `<span class="mdelta ${c >= 0 ? 'up' : 'down'}">${sgn(c)}% from start</span>`; };
  const verdict = S.over === 'cash' ? `The money ran out in ${periodLabel(S.turn).toLowerCase()}`
    : S.over === 'board' ? `The board replaced you in ${periodLabel(S.turn).toLowerCase()}`
    : `Your ${TFS[S.tf].label} as ${role.short} is complete`;
  const rows = [
    ['Yearly revenue', x => money(x.rev)], ['Cash', x => money(x.cash)], ['Growth per year', x => x.growth.toFixed(0) + '%'],
    ['Profit margin', x => x.margin.toFixed(0) + '%'], ['Headcount', x => num(x.staff)], ['Team morale', x => Math.round(x.morale)],
    ['Customer satisfaction', x => Math.round(x.sat)], ['Tech debt', x => Math.round(x.debt)], ['Reputation', x => Math.round(x.rep)], ['Board confidence', x => Math.round(x.board)]
  ];
  const totalDec = Object.values(S.styles).reduce((a, b) => a + b, 0) || 1;
  const styleRows = Object.keys(STYLES).map(k => [k, S.styles[k] || 0]).filter(r => r[1] > 0).sort((a,b) => b[1]-a[1]);
  app.innerHTML = `
  <section style="max-width:56rem">
    <span class="co">${esc(S.name)}, ${esc(SIZES[S.size].label.toLowerCase())} in ${esc(S.domain)}</span>
    <h1 class="verdict">${esc(verdict)}</h1>
    <p class="lede" style="font-size:1.08rem">Estimated company value, and what happened once the consequences you set in motion finished landing.</p>
    <div class="chain">
      <div><span class="lab">When you started</span><span class="big">${money(S.valueStart)}</span></div>
      <div><span class="lab">When you left</span><span class="big">${money(S.valueExit)}</span>${pct(S.valueExit, S.valueStart)}</div>
      <div><span class="lab">After your long-term bets landed</span><span class="big">${money(S.valueLegacy)}</span>${pct(S.valueLegacy, S.valueStart)}</div>
    </div>
    <p class="muted small">${S.pending.length} consequence${S.pending.length === 1 ? '' : 's'} landed after you left. <button class="link" style="padding:0;color:var(--accent)" data-act="term" data-term="Valuation">How value is estimated</button></p>

    <h2 class="sec">Coach’s review</h2>
    <div class="review" id="review" aria-live="polite">${S.review ? reviewHTML(S.review) : '<p class="muted">Your coach is reading through your decisions…</p>'}</div>

    <h2 class="sec">Your leadership instincts</h2>
    <p class="muted small" style="margin:0">Share of your choices, including each lever you set, that leaned each way.</p>
    <div class="styles">${styleRows.map(([k,c]) => `<div class="s"><span>${STYLES[k]}</span><span class="track2"><i style="width:${c/totalDec*100}%"></i></span><span>${Math.round(c/totalDec*100)}%</span></div>`).join('')}</div>

    <h2 class="sec">The numbers</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Measure</th><th>Start</th><th>When you left</th><th>After ripples</th></tr></thead>
      <tbody>${rows.map(([n,f]) => `<tr><td>${n}</td><td>${f(s)}</td><td>${f(m)}</td><td>${f(lm)}</td></tr>`).join('')}</tbody>
    </table></div>

    ${S.pending.length ? `<h2 class="sec">What landed after you left</h2><ul class="loglist">${S.pending.map(p => `<li><span class="w">${p.h === 'medium' ? 'Medium-term' : 'Long-term'} effect of “${esc(p.from)}”</span><br>${esc(p.note)}${chips(p.e)}</li>`).join('')}</ul>` : ''}

    <h2 class="sec">Your decisions</h2>
    <ul class="loglist">${S.log.map(l => `<li><span class="w">${esc(l.when)}: ${esc(l.title)}</span><br><b>${esc(l.choice)}</b> <span class="muted small">${esc(STYLES[l.style])}${l.custom ? ', your own idea' : ''}</span></li>`).join('')}</ul>

    <div class="row" style="margin:2rem 0 3rem">
      <button class="btn" data-act="again">Play again with these settings</button>
      <button class="btn ghost" data-act="tosetup">Change settings</button>
    </div>
  </section>`;
}

/* ---------- Drawer ---------- */
function openDrawer(mode, focusTerm){
  drawerMode = mode;
  const panel = $('#panel');
  if (mode === 'glossary'){
    const all = { ...BASE_TERMS, ...(S ? S.terms : {}) };
    const keys = Object.keys(all).sort((a,b) => a.localeCompare(b));
    panel.innerHTML = `<div class="panel-head"><h2 id="panel-title">Glossary</h2><button class="link" data-act="close">Close</button></div>
      <p class="muted small" style="margin:0">Every term from your briefings is collected here.</p>
      <dl>${keys.map(k => `<dt id="t-${esc(k.replace(/\W+/g,'-'))}" class="${k === focusTerm ? 'hl' : ''}">${esc(k)}</dt><dd>${esc(all[k])}</dd>`).join('')}</dl>`;
  } else {
    panel.innerHTML = `<div class="panel-head"><h2 id="panel-title">Decisions so far</h2><button class="link" data-act="close">Close</button></div>
      ${S && S.log.length ? `<ul class="loglist">${S.log.map(l => `<li><span class="w">${esc(l.when)}: ${esc(l.title)}</span><br><b>${esc(l.choice)}</b> <span class="muted small">${esc(STYLES[l.style])}</span></li>`).join('')}</ul>` : '<p class="muted">No decisions yet. Your choices will appear here.</p>'}
      ${S && S.pending.length && S.phase !== 'end' ? `<h3 style="margin-top:1.5rem;font-size:1rem">Still on their way</h3><ul class="loglist">${S.pending.map(p => `<li><span class="w">${p.due >= S.total ? 'After you leave' : esc(periodLabel(p.due))}, ${p.h}-term</span><br>${esc(p.note)}</li>`).join('')}</ul>` : ''}`;
  }
  $('#drawer').hidden = false;
  if (focusTerm){ const el = document.getElementById('t-' + focusTerm.replace(/\W+/g,'-')); if (el) el.scrollIntoView({block:'center'}); }
  const btn = panel.querySelector('[data-act="close"]'); if (btn) btn.focus();
}
function closeDrawer(){ $('#drawer').hidden = true; drawerMode = null; }

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'close-scrim'){ if (e.target === el) closeDrawer(); return; }
  if (a === 'close') return closeDrawer();
  if (a === 'glossary') return openDrawer('glossary');
  if (a === 'log') return openDrawer('log');
  if (a === 'term') return openDrawer('glossary', el.dataset.term);
  if (a === 'set'){ draft[el.dataset.k] = el.dataset.v; return renderSetup(); }
  if (a === 'start') return newGame(draft);
  if (a === 'resume'){
    const sv = loadSave(); if (!sv) return renderSetup();
    S = sv; if (S.source === 'ai' && !sample) S.source = 'bank';
    if (S.phase === 'evaluating') S.phase = 'scenario';
    if (S.phase === 'loading' || S.phase === 'error' || !S.scenario) return loadScenario();
    return render();
  }
  if (a === 'discard'){ clearSave(); return renderSetup(); }
  if (!S) return;
  if (a === 'lever'){ S.leverPick = S.leverPick || {}; S.leverPick[Number(el.dataset.l)] = Number(el.dataset.c); save(); render(); return; }
  if (a === 'commitlevers') return resolveLevers();
  if (a === 'choose'){ const opt = S.scenario.options[Number(el.dataset.i)]; if (opt) resolveDecision(opt, false); return; }
  if (a === 'custom') return commitCustom();
  if (a === 'ask') return askMentor();
  if (a === 'advance') return advance();
  if (a === 'retry') return loadScenario();
  if (a === 'bankonce') return setScenario(pickBank());
  if (a === 'tobank'){ if (busy){ busy.toBank = true; busy.ctl.abort(); } return; }
  if (a === 'newgame'){
    if (newGameArmed > Date.now()){
      newGameArmed = 0; if (busy){ busy.ctl.abort(); busy = null; }
      clearSave(); S = null; return renderSetup();
    }
    newGameArmed = Date.now() + 4000; renderNav();
    setTimeout(renderNav, 4100); return;
  }
  if (a === 'again'){ const d = { role:S.role, domain:S.domain, customDomain:'', size:S.size, tf:S.tf, name:S.name, source:S.source }; clearSave(); return newGame(d); }
  if (a === 'tosetup'){ draft.role = S.role; draft.size = S.size; draft.tf = S.tf; clearSave(); S = null; return renderSetup(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'co-name') draft.name = t.value;
  else if (t.id === 'dom-other') draft.customDomain = t.value;
  else if (t.id === 'cd' && S) S.customDraft = t.value;
  else if (t.id === 'mq' && S) S.mentorDraft = t.value;
  else if (t.classList && t.classList.contains('codein')) setCode(t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer();
  if (e.key === 'Enter' && e.target.id === 'mq'){ e.preventDefault(); askMentor(); }
});
document.addEventListener('toggle', e => {
  if (S && e.target.matches && e.target.matches('[data-mentor]')) S.mentorOpen = e.target.open;
}, true);
setInterval(() => {
  if (!busy) return;
  const el = $('#busy-line'); if (!el) return;
  const secs = Math.round((Date.now() - busy.t0) / 1000);
  el.textContent = busy.chars ? `Writing… ${secs}s` : `Thinking… ${secs}s. This usually takes 10 to 40 seconds.`;
}, 1000);

renderSetup();
</script>
</body>
</html>
