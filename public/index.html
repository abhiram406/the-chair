<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Chair: an executive decision simulator</title>
<meta name="description" content="Train to be a CEO or CTO by making decisions whose effects ripple over months and years.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8ECF0; --surface:#FFFFFF; --soft:#F2F5F8; --ink:#131C25; --muted:#56636F; --line:#CBD3DB;
  --accent:#2340C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#0F7356; --bad:#AE3427; --med:#9A600B; --long:#6A3BC2;
  --good-soft:#E0F2EB; --bad-soft:#F8E4E1; --med-soft:#F6ECDA; --long-soft:#ECE5F9;
  --scrim:rgba(10,16,22,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1318; --surface:#151E26; --soft:#1B2630; --ink:#E3E9EF; --muted:#93A1AE; --line:#2A3744;
    --accent:#8FA3FF; --accent-ink:#0D1318; --accent-soft:#1F2950;
    --good:#4FC79B; --bad:#FF8B7B; --med:#E9AF55; --long:#BBA0FF;
    --good-soft:#123227; --bad-soft:#3A1C18; --med-soft:#382A12; --long-soft:#2A2042;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1318; --surface:#151E26; --soft:#1B2630; --ink:#E3E9EF; --muted:#93A1AE; --line:#2A3744;
  --accent:#8FA3FF; --accent-ink:#0D1318; --accent-soft:#1F2950;
  --good:#4FC79B; --bad:#FF8B7B; --med:#E9AF55; --long:#BBA0FF;
  --good-soft:#123227; --bad-soft:#3A1C18; --med-soft:#382A12; --long-soft:#2A2042;
  --scrim:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.serif{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem clamp(1rem,4vw,2rem)}
.brand{font-stretch:125%;font-weight:850;font-size:1.05rem;letter-spacing:-.01em;margin:0;white-space:nowrap}
@media (max-width:480px){.top .link{padding:.35rem .4rem;font-size:.84rem}.top .topnav{gap:.1rem;flex-wrap:nowrap}}
.topnav{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.link{background:none;border:0;padding:.4rem .6rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.link:hover{color:var(--ink);background:var(--soft)}
.link.warn{color:var(--bad)}

.wrap{max-width:1180px;margin:0 auto;padding:clamp(1rem,3vw,2rem)}
.btn{font-weight:700;border-radius:10px;padding:.8rem 1.25rem;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.notice{background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin:0 0 1rem;font-size:.92rem}
.errbox{background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:.9rem 1rem;margin:1rem 0}

/* Setup */
.hero{padding:clamp(1rem,5vw,3rem) 0 clamp(1.5rem,4vw,2.5rem);max-width:52rem}
.hero h1{font-stretch:125%;font-weight:900;font-size:clamp(2.7rem,10vw,5.6rem);line-height:.9;letter-spacing:-.03em;margin:0 0 1.1rem}
.lede{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(1.1rem,2.4vw,1.3rem);line-height:1.55;max-width:38rem;margin:0}
.ripple{display:flex;gap:0;margin-top:1.6rem;max-width:34rem}
.ripple div{flex:1;border-top:3px solid var(--ink);padding-top:.45rem;font-size:.82rem;font-weight:600}
.ripple div:nth-child(2){border-color:var(--med);color:var(--med)}
.ripple div:nth-child(3){border-color:var(--long);color:var(--long);border-top-style:dashed}
.setup-grid{display:grid;gap:2rem;max-width:62rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-stretch:112%;font-weight:800;font-size:1.15rem;margin-bottom:.2rem;padding:0}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 .7rem}
.choices{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.choice{display:block;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;cursor:pointer}
.choice:hover{border-color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice b{display:block;font-size:1.05rem;font-stretch:108%}
.choice span{display:block;color:var(--muted);font-size:.88rem;margin-top:.15rem}
.pills{display:flex;flex-wrap:wrap;gap:.45rem}
.pill{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.45rem .85rem;cursor:pointer;font-size:.93rem}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:650}
.field{display:block;margin-top:.7rem}
.field input,textarea,.qrow input{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.65rem .8rem}
.field input:focus,textarea:focus,.qrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field span{display:block;font-weight:650;font-size:.92rem;margin-bottom:.3rem}
.resume{border:1.5px dashed var(--line);border-radius:12px;padding:1rem;margin-bottom:2rem;max-width:62rem}
.startbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding-bottom:2rem}

/* Game */
.status{margin-bottom:1.25rem}
.co{font-weight:650;color:var(--muted);font-size:.95rem}
.period{font-stretch:125%;font-weight:880;font-size:clamp(1.9rem,6vw,3.1rem);line-height:1;letter-spacing:-.025em;margin:.2rem 0 .3rem}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 1rem}
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) minmax(0,1.6fr);gap:4px}
.slot{min-height:3.3rem;border-radius:7px;background:var(--surface);border:1px solid var(--line);padding:.35rem .4rem;display:flex;flex-direction:column;justify-content:space-between;gap:.25rem;min-width:0}
.slot.past{background:var(--soft);color:var(--muted);border-color:transparent}
.slot.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot.after{border-style:dashed;background:transparent}
.tick{font-size:.74rem;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.med{background:var(--med)}.dot.long{background:var(--long)}
.slot.now .dot{box-shadow:0 0 0 1.5px var(--bg)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

.cols{display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:920px){
  .cols{grid-template-columns:290px minmax(0,1fr)}
  .metrics{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);align-self:start}
}
.metrics h2{font-size:.95rem;margin:0 0 .5rem;font-weight:750}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.metric{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;cursor:pointer;min-width:0}
.metric:hover{border-color:var(--muted)}
.mlabel{display:block;font-size:.74rem;color:var(--muted);line-height:1.25}
.mval{display:block;font-stretch:112%;font-weight:750;font-size:1.12rem;font-variant-numeric:tabular-nums;line-height:1.3}
.mdelta{font-size:.74rem;font-weight:650;font-variant-numeric:tabular-nums}
.mdelta.up{color:var(--good)}.mdelta.down{color:var(--bad)}
.bar{height:4px;background:var(--soft);border-radius:2px;margin-top:.35rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted)}
.bar i.ok{background:var(--good)}.bar i.warn{background:var(--med)}.bar i.risk{background:var(--bad)}
.valuebox{margin-top:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;text-align:left;width:100%;cursor:pointer}
.drift{margin-top:.6rem;font-size:.84rem;color:var(--bad)}
.drift p{margin:.2rem 0}

.stage{max-width:47rem;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
.kind{color:var(--accent);font-weight:650;font-size:.92rem;margin:0}
.title{font-stretch:110%;font-weight:800;font-size:clamp(1.45rem,3.6vw,1.95rem);line-height:1.15;letter-spacing:-.015em;margin:.2rem 0 1rem}
.prose p{font-family:"Source Serif 4",Georgia,serif;font-size:1.1rem;line-height:1.65;margin:0 0 .9rem}
.stakes{list-style:none;padding:0;margin:1rem 0;display:grid;gap:.4rem}
.stakes li{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5rem .75rem;font-size:.93rem}
details{margin:.9rem 0}
summary{cursor:pointer;font-weight:700;padding:.3rem 0}
dl.terms{margin:.4rem 0 0}
dl.terms dt{font-weight:700;margin-top:.55rem}
dl.terms dd{margin:.1rem 0 0;color:var(--muted)}
.analogy{border-left:3px solid var(--accent);padding:.15rem 0 .15rem 1rem;margin:1.3rem 0}
.analogy h4,.lesson h4,.case h4{margin:0 0 .25rem;font-size:.92rem}
.analogy p,.lesson p,.case p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.03rem;line-height:1.6}
.dh{font-stretch:110%;font-weight:800;font-size:1.2rem;margin:1.8rem 0 .3rem}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:.55rem 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.olabel{display:block;font-weight:720;font-size:1.04rem}
.odetail{display:block;color:var(--muted);font-size:.94rem;margin-top:.2rem}
.custom{margin-top:1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.custom label{display:block;font-weight:700;margin-bottom:.15rem}
.custom textarea{min-height:6.5rem;resize:vertical;margin:.5rem 0 .6rem;line-height:1.5}
.mentor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.4rem 1rem}
.qa{margin:.6rem 0;font-size:.95rem}
.qa .q{font-weight:700}
.qa .a{white-space:pre-wrap;margin-top:.2rem;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;line-height:1.6}
.qrow{display:flex;gap:.5rem;margin:.5rem 0 .7rem}
.qrow .btn{padding:.6rem 1rem;flex:none}
.landed{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:0 0 1.4rem}
.landed h3{margin:0 0 .4rem;font-size:1rem}
.landed .item{border-left:3px solid var(--med);padding:.1rem 0 .1rem .75rem;margin:.6rem 0}
.landed .item.long{border-color:var(--long)}
.landed .from{font-size:.82rem;color:var(--muted)}
.landed p{margin:.1rem 0}

.wave{border-radius:12px;padding:.95rem 1.1rem;margin:.75rem 0;border:1px solid var(--line);background:var(--surface);border-left-width:5px}
.wave.now{border-left-color:var(--accent)}
.wave.med{border-left-color:var(--med)}
.wave.long{border-left-color:var(--long)}
.wave h4{margin:0 0 .25rem;font-size:.95rem}
.wave p{margin:0}
.sealed{font-size:.84rem;color:var(--muted);margin-top:.35rem!important}
.chips{list-style:none;padding:0;margin:.55rem 0 0;display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font-size:.82rem;font-weight:650;padding:.2rem .6rem;border-radius:999px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.lesson{background:var(--accent-soft);border-radius:12px;padding:1rem 1.1rem;margin:1.2rem 0}
.case{border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:1rem 0;background:var(--surface)}
.case .tag{font-size:.8rem;color:var(--muted);margin-top:.5rem!important;font-family:"Archivo",system-ui,sans-serif}
.feedback{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.6;margin:0 0 1rem}
.paths .path{margin:.8rem 0;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.paths .path:last-child{border-bottom:0}
.paths .path p{margin:.15rem 0;font-size:.93rem}
.next{margin:1.6rem 0 2rem}

.loading{padding:2.5rem 0}
.pulse{display:flex;gap:6px;margin-bottom:1rem}
.pulse i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.pulse i:nth-child(2){animation-delay:.15s;background:var(--med)}
.pulse i:nth-child(3){animation-delay:.3s;background:var(--long)}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse i{animation:none;opacity:.8}}

/* End */
.verdict{font-stretch:120%;font-weight:880;font-size:clamp(2rem,6vw,3.4rem);line-height:1;letter-spacing:-.025em;margin:.3rem 0 1rem;max-width:44rem}
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;margin:1.2rem 0 .4rem}
.chain div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.chain div:last-child{border-style:dashed;border-color:var(--long)}
.chain .lab{font-size:.84rem;color:var(--muted)}
.chain .big{display:block;font-stretch:115%;font-weight:820;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:.84rem}
.styles{display:grid;gap:.45rem;margin:.6rem 0}
.styles .s{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 2.8rem;gap:.6rem;align-items:center;font-size:.9rem}
.styles .track2{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.styles .track2 i{display:block;height:100%;background:var(--accent)}
.review{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin:1rem 0}
.review p{font-family:"Source Serif 4",Georgia,serif;font-size:1.06rem;line-height:1.65;margin:0 0 .8rem}
.review p:last-child{margin-bottom:0}
.loglist{list-style:none;padding:0;margin:.5rem 0}
.loglist li{padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.93rem}
.loglist .w{color:var(--muted);font-size:.82rem}
h2.sec{font-stretch:110%;font-weight:800;font-size:1.25rem;margin:2rem 0 .3rem}


/* Levers */
.lever-intro{color:var(--muted);font-size:.93rem;margin:.2rem 0 .4rem}
.lever{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem .9rem;margin:.6rem 0}
.lever legend{float:left;width:100%;font-stretch:108%;font-weight:760;font-size:1rem;margin:0 0 .5rem;padding:0}
.seg{clear:both;display:flex;flex-wrap:wrap;gap:.4rem}
.segbtn{background:var(--soft);border:1.5px solid transparent;border-radius:9px;padding:.5rem .75rem;cursor:pointer;font-size:.93rem;text-align:left;line-height:1.35}
.segbtn:hover{border-color:var(--muted)}
.segbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:650}
.commitrow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:1rem}
.plan{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.35rem}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.5rem .75rem;display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline}
.plan li span{color:var(--muted);font-size:.86rem;min-width:9.5rem}
.wave .notes p{margin:.2rem 0}
.combo{border:1.5px dashed var(--accent);border-radius:12px;padding:.9rem 1.1rem;margin:1rem 0;background:var(--surface)}
.combo h4{margin:0 0 .3rem;font-size:.95rem}
.combo p{margin:.4rem 0}
.combo .when{display:inline-block;font-weight:700;font-size:.8rem;color:var(--accent);margin-right:.35rem}

/* Drawer */
.drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:var(--scrim)}
.drawer[hidden]{display:none}
.panel{width:min(430px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1.25rem calc(env(safe-area-inset-bottom,0px) + 1.5rem)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.panel-head h2{margin:0;font-stretch:110%;font-size:1.3rem}
.panel dl dt{font-weight:750;margin-top:.9rem}
.panel dl dd{margin:.15rem 0 0;color:var(--muted);line-height:1.55}
.panel dt.hl{color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <p class="brand">The Chair</p>
  <nav class="topnav" id="topnav"></nav>
</header>
<main class="wrap" id="app"></main>
<div class="drawer" id="drawer" hidden data-act="close-scrim">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" id="panel"></div>
</div>

<script>
'use strict';
const SAVE_KEY = 'thechair.save.v1';

const ROLES = {
  CEO: { short:'CEO', full:'CEO (Chief Executive Officer)',
    blurb:'Run the whole company. You own strategy, money, people and culture, and you answer to the board.',
    focus:'As CEO they answer to the board of directors and own strategy, capital, people and culture. Keep most scenarios at that level, sometimes crossing into technology.' },
  CTO: { short:'CTO', full:'CTO (Chief Technology Officer)',
    blurb:'Own the technology. You decide how systems are built, keep them secure, lead the engineers, and explain technical bets in business terms.',
    focus:'As CTO they own technology strategy, architecture, security and the engineering organization, and must translate technical choices into business terms for the CEO and board. Keep most scenarios at that level, sometimes crossing into business strategy.' }
};
const DOMAINS = ['Subscription software (SaaS)','Fintech (financial technology)','Healthcare technology','Online retail','Manufacturing','Clean energy','Video games','Logistics and delivery','Media and streaming','Biotech'];
const SIZES = {
  startup:   { label:'Startup',   desc:'12 people, about $1M yearly revenue',    staff:12,    rev:1,    cash:5,    margin:-120, growth:100, base:70, morale:70, sat:60, debt:35, rep:45, board:65 },
  scaleup:   { label:'Scale-up',  desc:'150 people, about $25M yearly revenue',    staff:150,   rev:25,   cash:45,   margin:-30,  growth:60,  base:40, morale:62, sat:60, debt:45, rep:55, board:60 },
  midsize:   { label:'Mid-size',  desc:'1,500 people, about $300M yearly revenue', staff:1500,  rev:300,  cash:120,  margin:8,    growth:15,  base:12, morale:58, sat:62, debt:52, rep:60, board:60 },
  enterprise:{ label:'Enterprise',desc:'20,000 people, about $5B yearly revenue',   staff:20000, rev:5000, cash:2000, margin:12,   growth:4,   base:4,  morale:55, sat:60, debt:60, rep:68, board:62 }
};
const TFS = {
  '1y': { label:'1 year',   turns:4,  p:.25, unit:'quarter', med:2, long:4, desc:'4 decisions, one per quarter' },
  '3y': { label:'3 years',  turns:6,  p:.5,  unit:'half',    med:2, long:4, desc:'6 decisions, one every six months' },
  '5y': { label:'5 years',  turns:10, p:.5,  unit:'half',    med:2, long:5, desc:'10 decisions, one every six months' },

   caseStudy:{company:'GDPR',year:'2018',summary:'When Europe’s General Data Protection Regulation took effect in May 2018, some US news sites, including the Los Angeles Times and Chicago Tribune, blocked European visitors rather than comply. Others, like Apple, made privacy a centerpiece of their marketing.'},
   levers:[
    lv('Approach',[
     ch('Do the legal minimum','cautious','Compliance work begins.',{cash:-2}),
     ch('Make privacy a selling point','customer','A bigger investment.',{cash:-5,debt:-2},'Privacy-conscious customers choose you.',{rep:4,sat:2},'Trust becomes an advantage rivals can’t copy quickly.',{growth:2}),
     ch('Withdraw from that market','bold','Revenue from the region disappears.',{rev:-6},'','','A competitor takes the market.',{growth:-2})]),
    lv('Data collection',[
     ch('Collect much less data','customer','Marketing loses some targeting.',{growth:-2},'Less data means less risk.',{rep:2}),
     ch('Keep collecting, with consent prompts','finance','Fewer people say yes than hoped.',{growth:-1})]),
    lv('Ownership',[
     ch('Hire a full-time privacy officer','tech','A new senior hire.',{cash:-1},'Issues are caught early.',{board:2}),
     ch('Use outside consultants','finance','Cheaper.',{},'Gaps appear between projects.',{debt:2})])],
   combos:[
    cb({0:0,2:1},'long','A minimal approach with no owner: an audit finds violations, and a fine follows.',{cash:-8,rep:-5,board:-5}),
    cb({0:1,1:0},'medium','Collecting less while marketing privacy rings true, and the press holds you up as an example.',{rep:4})],
   lesson:'Regulation is a cost everyone pays. The question is whether you treat it as a burden or an advantage.' },

 { id:'hiring', type:'Talent', title:'Hiring for hypergrowth',
   situation:['Demand for {co}’s product has doubled. The plan calls for doubling headcount within a year, and every team says it is understaffed.','Recruiters warn that good candidates are scarce and slow to hire.'],
   stakeholders:['Team leads: “We need people now.”','Head of people: “Hire too fast and we’ll spend next year undoing it.”'],
   glossary:[['Hypergrowth','Very fast growth, often doubling or more each year.'],['Hiring bar','The standard a candidate must meet to get an offer.'],['Onboarding','Helping new hires learn the job and become productive.'],['Contractor','Someone hired for a specific project rather than as an employee.']],
   analogy:'Hiring too fast is like adding water to soup to feed more guests. Do it too quickly and everyone gets a thinner bowl.',
   caseStudy:{company:'Meta',year:'2022',summary:'Meta, like many tech companies, hired rapidly during the pandemic boom. In November 2022 it laid off about 11,000 employees, and CEO Mark Zuckerberg said he had gotten the growth forecast wrong.'},
   levers:[
    lv('Hiring pace',[
     ch('Double headcount this year','bold','Recruiting costs surge.',{staff:12,cash:-5,margin:-3},'More hands, more coordination.',{growth:3,debt:2}),
     ch('Grow 30% and prioritize','cautious','Teams must choose what matters.',{staff:5,margin:-1,morale:-1},'','','Steady growth builds lasting teams.',{morale:2}),
     ch('Use contractors to fill gaps','finance','Fast and flexible.',{cash:-2},'Knowledge walks out when contracts end.',{debt:3})]),
    lv('Hiring bar',[
     ch('Keep the bar high','tech','Seats stay empty longer.',{growth:-1},'Strong hires lift everyone.',{morale:2}),
     ch('Lower it to fill seats','finance','Teams fill up fast.',{growth:2},'Quality varies widely.',{debt:3,sat:-2},'Performance problems pile up.',{morale:-3})]),
    lv('Onboarding',[
     ch('Build a proper onboarding program','people','An investment of time.',{cash:-1},'New hires get productive faster.',{growth:2}),
     ch('Pair each newcomer with a buddy','people','Cheap and personal.',{},'It works, but veterans are stretched.',{growth:1,morale:-1}),
     ch('Let teams figure it out','cautious','',{},'Newcomers flounder.',{growth:-1,morale:-2})])],
   combos:[
    cb({0:0,1:1},'long','Doubling headcount with a lower bar dilutes the culture, and within two years you face painful cuts.',{staff:-8,morale:-6,rep:-3}),
    cb({0:0,2:2},'medium','Hundreds of new people and no onboarding: veterans spend their days answering questions.',{growth:-3,morale:-3})],
   lesson:'More people is not the same as more capability. Hire at the speed you can absorb newcomers.' },

 { id:'exclusive', type:'Strategy', title:'A giant wants an exclusive deal',
   situation:['One of the largest companies in your industry wants to bundle {co}’s product with its own, putting you in front of millions of customers. In return, it wants exclusivity: you couldn’t sell through any of its competitors.','It also wants access to your customer data.'],
   stakeholders:['Head of partnerships: “This is the deal of the decade.”','Head of strategy: “Exclusivity makes them our only door.”'],
   glossary:[['Exclusivity','An agreement not to work with anyone else in a category.'],['Distribution','How a product reaches customers.'],['Integration','Connecting two products so they work together.']],
   analogy:'An exclusive deal is like a record label offering a huge advance. The money is great, but they may end up owning your next album.',
   caseStudy:{company:'Microsoft and IBM',year:'1980',summary:'When IBM needed an operating system for its first PC, Microsoft licensed MS-DOS to IBM but kept the right to sell it to other manufacturers. As IBM-compatible clones spread, Microsoft sold to all of them and became the industry’s dominant software company.'},
   levers:[
    lv('Exclusivity',[
     ch('Accept full exclusivity','bold','A huge launch through their channel.',{rev:8,growth:3},'You depend on them now.',{board:-2},'They renegotiate from strength.',{margin:-4}),
     ch('Offer a non-exclusive deal on lower terms','finance','A smaller deal, with freedom kept.',{rev:3,growth:1},'','','You sell through every channel.',{growth:3}),
     ch('Decline','cautious','',{},'They partner with a competitor.',{growth:-2})]),
    lv('Integration',[
     ch('Deep integration','tech','A big engineering effort.',{debt:4,growth:-1},'Customers love the seamless experience.',{sat:3}),
     ch('Light integration','cautious','',{})]),
    lv('Customer data',[
     ch('Share customer data','finance','They pay a premium for it.',{cash:3},'Some customers object.',{rep:-3,sat:-2},'They learn enough to build their own version.',{growth:-3}),
     ch('Keep data private','customer','A smaller payment.',{},'','','Your customer relationships stay yours.',{rep:2})])],
   combos:[
    cb({0:0,2:0},'long','With exclusivity and your data in hand, the giant launches its own competing product.',{rev:-8,growth:-4}),
    cb({0:1,1:0},'medium','A deep integration without exclusivity becomes a template you reuse with other partners.',{growth:3})],
   lesson:'In partnerships, protect your options. Revenue now is worth less if it costs you control later.' },

 { id:'pivot', type:'Strategy', title:'Customers are using you for something else',
   situation:['Usage data shows something unexpected: a fast-growing group of {co}’s customers use one minor feature for a completely different purpose. That group is growing 15% a month, while the core business is flat.','Your original customers still pay most of the bills.'],
   stakeholders:['Head of product: “This is where the future is.”','Head of sales: “Our existing customers pay the salaries.”'],
   glossary:[['Pivot','A fundamental change in what a company sells or to whom.'],['Core business','The main product that brings in most of the revenue.'],['Spin-off team','A separate group set up to pursue a new direction.']],
   analogy:'It’s like a bakery that notices customers keep lining up for its coffee. Do you become a café, or keep baking?',
   caseStudy:{company:'Slack',year:'2013',summary:'Slack began as an internal chat tool at Tiny Speck, a company making an online game called Glitch. The game failed, and in 2013 the team pivoted to selling the chat tool. Slack became one of the fastest-growing business software products ever.'},
   levers:[
    lv('Focus',[
     ch('Pivot fully to the new use','bold','Original customers feel abandoned.',{rev:-6,sat:-4,morale:-2},'The new market takes off.',{growth:6},'You’ve found a bigger opportunity.',{growth:4,rep:3}),
     ch('Serve both','cautious','Teams are split.',{growth:1},'Neither gets full attention.',{debt:3}),
     ch('Stay with the core','finance','Steady revenue continues.',{},'','','A startup builds the thing you spotted first.',{growth:-3})]),
    lv('Team structure',[
     ch('Spin up a separate team','tech','A dedicated group with its own goals.',{cash:-3,staff:2},'It moves fast.',{growth:2}),
     ch('Have existing teams share the work','cautious','',{},'Priorities clash.',{morale:-2})]),
    lv('Brand',[
     ch('Launch a new brand for it','bold','Marketing costs.',{cash:-2},'A clear message for the new market.',{growth:2}),
     ch('Keep one brand','finance','',{},'The message gets muddled.',{rep:-1})])],
   combos:[
    cb({0:1,1:1},'medium','Serving both markets with the same teams spreads everyone thin, and both products slip.',{growth:-3,morale:-3}),
    cb({0:0,1:0},'long','A focused team on the new market compounds its head start.',{growth:3})],
   lesson:'Customers often find your real product before you do. Watch what they do, not just what they buy.' },

 { id:'ransomware', type:'Crisis', title:'Ransomware has locked your systems',
   situation:['Attackers have encrypted {co}’s internal systems and demand a ransom in cryptocurrency. Customer-facing services are degraded, and the attackers claim to have copied customer data.','Backups exist, but restoring everything could take two weeks.'],
   stakeholders:['Head of operations: “Paying gets us back today.”','Security lead: “Paying funds the next attack and guarantees nothing.”'],
   glossary:[['Ransomware','Malicious software that locks your files until you pay.'],['Encrypted','Scrambled so it can’t be read without a key.'],['Restore from backup','Rebuild systems from saved copies.']],
   analogy:'Paying a ransom is like paying a burglar to return your keys. You might get them back, but now he knows where you live.',
   caseStudy:{company:'Colonial Pipeline',year:'2021',summary:'A ransomware attack forced Colonial Pipeline, which carries much of the US East Coast’s fuel, to shut down for several days. It paid about $4.4 million in ransom; the US Justice Department later recovered roughly $2.3 million of it.'},
   levers:[
    lv('The ransom',[
     ch('Pay it','finance','Systems unlock within days.',{cash:-5,sat:-2},'You’re known as a company that pays.',{rep:-3},'Attackers come back.',{cash:-3}),
     ch('Refuse and restore from backups','bold','Two hard weeks of downtime.',{rev:-4,sat:-5,morale:-3},'Systems come back clean.',{debt:-3})]),
    lv('Disclosure',[
     ch('Notify customers immediately','customer','Hard headlines.',{rep:-4,sat:-2},'Credit for honesty.',{rep:3}),
     ch('Wait until you know what was taken','cautious','',{},'If data leaks first, it looks like a cover-up.',{rep:-6,board:-4})]),
    lv('Afterward',[
     ch('Rebuild security from the ground up','tech','Major spending.',{cash:-5,growth:-2},'Far fewer weak points.',{debt:-5},'Security becomes a selling point.',{rep:3}),
     ch('Patch the hole and move on','finance','Quick and cheap.',{},'','','Other holes remain.',{debt:3})])],
   combos:[
    cb({0:0,2:1},'long','You paid and only patched. The same group attacks again a year later.',{cash:-6,rep:-5,board:-6}),
    cb({0:1,1:0},'medium','Refusing and being open earns rare praise, and the customers who stayed become loyal.',{sat:4})],
   lesson:'In a crisis, act on principles you can defend later: be honest with customers, and fix causes, not symptoms.' },

 { id:'safety', type:'Ethics and compliance', title:'An engineer says it isn’t safe',
   situation:['The night before a major launch, a senior engineer at {co} warns that a component could fail under certain conditions and harm users. Others think the risk is tiny.','Delaying would mean missing a big partner commitment and this quarter’s target.'],
   stakeholders:['Program manager: “The odds are tiny and the deal is huge.”','Senior engineer: “I can’t sign off on this.”'],
   glossary:[['Risk assessment','Estimating how likely a harm is and how bad it would be.'],['Escalate','To raise an issue to more senior people.'],['Safety review','A formal check before launch, with the power to stop it.']],
   analogy:'It’s like a pilot hearing an odd engine noise before takeoff with a full plane. Most noises are nothing, which is exactly why checklists exist.',
   caseStudy:{company:'Space Shuttle Challenger',year:'1986',summary:'Engineers at contractor Morton Thiokol warned that the shuttle’s O-ring seals might fail in the cold forecast for launch day. Managers overruled them, and Challenger broke apart 73 seconds after liftoff, killing all seven crew members.'},
   levers:[
    lv('Launch',[
     ch('Delay until it’s fixed','customer','The partner is unhappy, and the quarter is missed.',{rev:-4,board:-4},'The fix ships.',{sat:2},'Your safety record becomes an asset.',{rep:4}),
     ch('Launch with limits on the risky conditions','cautious','A partial launch.',{rev:-1,debt:2}),
     ch('Launch as planned','bold','Targets are hit.',{rev:3,board:2},'A small number of failures occur.',{sat:-6,rep:-6},'Lawsuits follow.',{cash:-8,rep:-4})]),
    lv('The engineer',[
     ch('Back them publicly inside the company','people','Engineers see that warnings matter.',{morale:4},'','','People raise problems early.',{debt:-2}),
     ch('Thank them, then decide without them','cautious','The engineer feels sidelined.',{morale:-3},'','','People stop speaking up.',{debt:2})]),
    lv('Process',[
     ch('Create a formal safety review','tech','Adds a step to every launch.',{growth:-1},'','','Fewer surprises.',{rep:2,debt:-2}),
     ch('Keep the current process','finance','',{})])],
   combos:[
    cb({0:2,1:1},'medium','You launched over a documented objection. When failures surface, that objection is the headline.',{rep:-10,board:-10}),
    cb({0:0,1:0},'long','Teams learn that raising concerns is valued, and problems now surface weeks earlier.',{debt:-3,morale:2})],
   lesson:'When experts warn of serious harm, the burden should be on proving it’s safe, not on proving it’s dangerous.' },

 { id:'opensource', type:'Technology', title:'Open source or closed?',
   situation:['{co}’s core technology could be released as open source. Developers would adopt it faster, but a big cloud provider could also sell it as a service without paying you.','Your board is divided.'],
   stakeholders:['Developer advocate: “Open source is the fastest path to adoption.”','Finance lead: “We’d be giving away the product.”'],
   glossary:[['Open source','Software whose code anyone can read, use and modify.'],['Source-available','Code that anyone can read, but with limits on commercial use.'],['Fork','A separate copy of an open-source project that goes its own way. To “fork” a project is to make that copy.'],['Hosted service','Running the software for customers so they don’t have to.']],
   analogy:'Open-sourcing is like publishing your recipes. More people cook your dishes and know your name, but another restaurant can serve them too.',
   caseStudy:{company:'Elastic',year:'2021',summary:'Elastic changed the license of its popular open-source search engine, Elasticsearch, in 2021, after Amazon had long offered it as a paid cloud service. Amazon responded by creating its own fork, called OpenSearch.'},
   levers:[
    lv('License',[
     ch('Fully open source','bold','Developers flock to it.',{rep:5,growth:2},'Adoption soars, and so do free riders.',{growth:2},'A cloud giant sells it as a service.',{rev:-4}),
     ch('Source-available with commercial limits','finance','Some developers grumble.',{rep:-1},'Revenue is protected.',{margin:2}),
     ch('Keep it closed','cautious','',{},'','','Open alternatives emerge.',{growth:-2})]),
    lv('Community',[
     ch('Fund a community team','people','A few hires.',{cash:-2,staff:1},'Outside contributors improve the code.',{debt:-3}),
     ch('Minimal community effort','cautious','',{})]),
    lv('How you make money',[
     ch('Sell a hosted cloud version','tech','Building the service.',{cash:-4,debt:3},'Recurring revenue grows.',{rev:4}),
     ch('Sell enterprise-only features','finance','Sales effort required.',{cash:-1},'Large customers pay for extras.',{rev:3,margin:1})])],
   combos:[
    cb({0:0,2:0},'long','Your own hosted service turns open-source fans into paying customers. It’s the version they trust most.',{rev:4,growth:2}),
    cb({0:0,1:1},'long','Open source with no community investment: contributors drift away, and a fork overtakes you.',{growth:-3,rep:-3})],
   lesson:'Giving away the code can win the market, but only if you are clear about what you will still charge for.' },

 { id:'aidata', type:'Ethics and compliance', title:'Training AI on customer data',
   situation:['{co}’s team wants to train a new AI feature on customer data already stored in your systems. It would make the product much smarter, and your terms of service arguably allow it.','A competitor faced a public backlash for something similar last year.'],
   stakeholders:['Head of AI: “The data is our biggest advantage.”','Head of customer success: “Our customers didn’t sign up for this.”'],
   glossary:[['Training data','Examples used to teach an AI model.'],['Opt-in','Users are included only if they actively agree.'],['Opt-out','Users are included unless they say no.'],['Terms of service','The legal agreement users accept to use a product.']],
   analogy:'It’s like a doctor using patient records to write a textbook. Maybe allowed, maybe useful, but patients will want to be asked.',
   caseStudy:{company:'Zoom',year:'2023',summary:'In 2023, users noticed that Zoom’s updated terms of service appeared to let it train AI on customer content. After a public backlash, Zoom revised the terms and said it would not use audio, video or chat content to train AI models without consent.'},
   levers:[
    lv('Consent',[
     ch('Ask customers to opt in','customer','Only some say yes.',{growth:-1},'Those who do are enthusiastic.',{sat:2,rep:2}),
     ch('Include everyone unless they opt out','finance','Lots of data, quickly.',{growth:2},'Some customers object loudly.',{rep:-3,sat:-2}),
     ch('Rely on your existing terms','bold','Maximum data, no friction.',{growth:3},'Journalists notice.',{rep:-6,sat:-4,board:-3})]),
    lv('Data handling',[
     ch('Strip out identifying details first','tech','Extra engineering work.',{cash:-2,growth:-1},'','','Lower legal risk.',{rep:2}),
     ch('Use the data as it is','finance','Faster to build.',{growth:1},'','','Regulators start asking questions.',{board:-3})]),
    lv('Communication',[
     ch('Announce it clearly','customer','Some pushback, but no surprises.',{rep:1}),
     ch('Update the terms quietly','cautious','',{},'Someone finds the change.',{rep:-4})])],
   combos:[
    cb({0:2,2:1},'medium','A quiet terms change plus broad data use: the backlash goes viral, and you reverse course under pressure.',{rep:-6,sat:-5,growth:-2}),
    cb({0:0,2:0},'long','Opt-in plus openness makes customers partners, and the volunteers share even more useful data.',{growth:2,sat:2})],
   lesson:'With customer data, ask whether customers would be surprised, not only whether it’s legal.' },

 { id:'buyout', type:'Mergers and acquisitions', title:'Someone wants to buy the company',
   situation:['A larger company has offered to buy {co} for 30% more than its current estimated value. Some investors want to take it; others think the company will be worth far more in a few years.','Rumors are already spreading inside the company.'],
   stakeholders:['Early investor: “This is a great return. Take it.”','Co-founder: “We’re just getting started.”'],
   glossary:[['Acquisition offer','A proposal to buy a company.'],['Premium','How much more than the current value a buyer offers.'],['Sale process','Inviting several possible buyers to compete.'],['Shareholders','The company’s owners.']],
   analogy:'It’s like getting an offer on your house halfway through a renovation. The money is real, but so is what the house could be worth.',
   caseStudy:{company:'Yahoo',year:'2008',summary:'In 2008 Microsoft offered to buy Yahoo for about $44.6 billion. Yahoo’s board rejected the offer as too low. In 2017 Yahoo’s core business was sold to Verizon for roughly $4.5 billion.'},
   levers:[
    lv('Your response',[
     ch('Accept','finance','Investors cheer; the team is anxious.',{board:6,morale:-5},'Integration plans take over.',{growth:-3}),
     ch('Negotiate for more','bold','Talks drag on.',{board:2,growth:-1},'A better offer, or the buyer walks.',{board:2}),
     ch('Reject and stay independent','cautious','Some investors are unhappy.',{board:-5,morale:3},'You have to prove you were right.',{board:-2},'If you grow, it was worth it.',{growth:2})]),
    lv('Other buyers',[
     ch('Invite other bidders','finance','Advisers’ fees.',{cash:-2},'Competition raises your value.',{board:4}),
     ch('Deal only with this buyer','cautious','',{})]),
    lv('Telling employees',[
     ch('Tell them now','people','Honest, but distracting.',{morale:-2,growth:-1},'Trust holds.',{morale:3}),
     ch('Wait until it’s decided','cautious','Work continues.',{},'Leaks feed rumors.',{morale:-4,staff:-2})])],
   combos:[
    cb({0:2,1:0},'medium','Running a sale process and then rejecting every bidder burns credibility with your board.',{board:-6}),
    cb({0:1,1:0},'medium','Competing bidders lift the offer substantially, and the board gives you credit.',{board:5})],
   lesson:'Selling is a one-way door. Know what the company is worth to you, and why, before anyone makes an offer.' },

 { id:'churn', type:'Customers', title:'Customers are quietly leaving',
   situation:['{co}’s monthly churn has doubled over six months. Exit surveys say the product is fine, but small frustrations add up, including fees customers find unfair.','Those late and cancellation fees bring in a meaningful slice of revenue.'],
   stakeholders:['Finance lead: “Those fees pay for a whole team.”','Customer success: “The fees are why people hate us.”'],
   glossary:[['Churn rate','The percentage of customers who cancel in a period.'],['Customer success','A team that helps customers get value from a product so they renew.'],['Net Promoter Score (NPS)','A measure of how likely customers are to recommend you.']],
   analogy:'Churn is a leaky bucket. Pouring in more water, meaning new customers, won’t help much until you patch the holes.',
   caseStudy:{company:'Blockbuster',year:'2000s',summary:'Around 2000, Blockbuster earned roughly $800 million a year from late fees, a large share of its revenue and a top customer complaint. Netflix built its subscription around having none. Blockbuster dropped late fees too late and filed for bankruptcy in 2010.'},
   levers:[
    lv('Fees',[
     ch('Eliminate the unpopular fees','customer','Revenue dips; customers cheer.',{rev:-4,sat:5},'Fewer cancellations.',{growth:2}),
     ch('Keep the fees','finance','Revenue holds.',{},'Frustration continues.',{sat:-3}),
     ch('Add a cancellation fee','bold','Fewer cancellations on paper.',{rev:2,sat:-6},'Anger spreads online.',{rep:-5},'Customers leave the moment they can.',{rev:-4})]),
    lv('Retention',[
     ch('Build a customer success team','people','New hires.',{cash:-3,staff:2},'At-risk customers are saved.',{sat:3,rev:2}),
     ch('Offer discounts to people who try to cancel','finance','Saves some accounts.',{margin:-2},'Customers learn to threaten to leave.',{margin:-2})]),
    lv('Product',[
     ch('Fix the top ten frustrations','tech','Feature work pauses.',{growth:-1,debt:-3},'Satisfaction rises.',{sat:4}),
     ch('Ship new features instead','bold','Exciting announcements.',{growth:1,debt:2},'The old annoyances remain.',{sat:-1})])],
   combos:[
    cb({0:0,2:0},'medium','Removing fees and fixing frustrations changes how customers talk about you, and referrals rise.',{growth:3,rep:3}),
    cb({0:2,1:1},'medium','Trapping customers with fees and bribing them with discounts teaches them you can’t be trusted.',{rep:-3,margin:-2})],
   lesson:'Revenue built on customer frustration is fragile. Remove the pain before a competitor does it for you.' },

 { id:'payequity', type:'Culture', title:'An audit finds unequal pay',
   situation:['An internal analysis shows that at {co}, women and some minority groups are paid less than peers in the same roles with similar performance, by an average of 7%.','Fixing it would cost real money, and employees have started comparing salaries.'],
   stakeholders:['Finance lead: “Let’s phase it in over three years.”','Head of people: “People already know. Delay looks worse.”'],
   glossary:[['Pay equity','Paying people the same for equivalent work.'],['Salary bands','The published minimum and maximum pay for each role and level.'],['Pay audit','An analysis of whether pay differences can be explained by legitimate factors.']],
   analogy:'Unequal pay is like a crooked picture on the wall. Once someone points it out, everyone sees it every time they walk by.',
   caseStudy:{company:'Salesforce',year:'2015 onward',summary:'In 2015, two Salesforce executives asked CEO Marc Benioff to check for gender pay gaps. An audit found them, and the company has since spent millions of dollars across repeated annual audits to close gaps, a commitment it continues to publicize.'},
   levers:[
    lv('Closing the gaps',[
     ch('Close all gaps now','people','An immediate cost.',{margin:-2,morale:4},'','','Trust is earned.',{rep:3}),
     ch('Phase it in over three years','finance','A lower immediate cost.',{margin:-1,morale:-2},'People feel it’s too slow.',{morale:-2}),
     ch('Don’t act yet','cautious','',{},'Underpaid staff start leaving.',{staff:-2,morale:-4},'A lawsuit becomes likely.',{cash:-5,rep:-4})]),
    lv('Transparency',[
     ch('Publish salary bands','bold','Some uncomfortable conversations.',{morale:-1},'Fewer pay disputes.',{morale:2},'Candidates trust your offers.',{rep:2}),
     ch('Keep pay private','cautious','',{})]),
    lv('Promotions',[
     ch('Introduce structured promotion criteria','tech','More process.',{growth:-1},'','','Gaps stop reappearing.',{morale:2}),
     ch('Keep manager discretion','cautious','',{},'','','Gaps creep back.',{morale:-2})])],
   combos:[
    cb({0:2,1:0},'short','Publishing salary bands without fixing the gaps puts the unfairness on display.',{morale:-8,rep:-4}),
    cb({0:0,2:0},'long','Fixing the gaps and the process that created them makes fairness stick, and recruiting gets easier.',{rep:3,morale:2})],
   lesson:'Fix the outcome and the process that produced it, or the problem will quietly return.' },

 { id:'secondproduct', type:'Strategy', title:'Building a second product',
   situation:['{co}’s core product is maturing, growth is slowing, and the board is asking what comes next. A promising neighboring market would use much of your existing technology.','Your best engineers are needed on both.'],
   stakeholders:['Head of strategy: “Without a second engine, we’ll stall.”','Engineering lead: “The core product still has problems.”'],
   glossary:[['Adjacent market','A market close to yours that you can reach with skills you already have.'],['Bundle','Selling several products together, usually at a discount.'],['Build, buy or partner','Create something yourself, acquire a company that has it, or team up with one.']],
   analogy:'A second product is like a restaurant adding catering. Same kitchen, new customers, but the dining room still needs serving.',
   caseStudy:{company:'Amazon Web Services',year:'2006',summary:'Amazon turned the computing infrastructure it had built for its own store into a product for other companies, launching AWS in 2006. It grew into Amazon’s most profitable business.'},
   levers:[
    lv('Approach',[
     ch('Build it yourselves','tech','A long, expensive build.',{cash:-6,growth:-1},'An early version launches.',{rev:2},'A second growth engine.',{growth:4}),
     ch('Buy a small company that has it','bold','A big check.',{cash:-12,rev:3,staff:3},'Integration is bumpy.',{debt:4}),

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const str = (v,d) => (typeof v === 'string' && v.trim()) ? v.trim() : d;
const copy = x => JSON.parse(JSON.stringify(x));
function money(v){
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1000) return s + '$' + (a/1000).toFixed(a >= 10000 ? 0 : 1) + 'B';
  if (a >= 1) return s + '$' + (a >= 100 ? a.toFixed(0) : a.toFixed(1)) + 'M';
  return s + '$' + Math.round(a*1000) + 'K';
}
const num = n => Math.round(n).toLocaleString('en-US');
const sgn = (v, d=0) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d);

function runway(m){
  if (m.margin >= 0) return null;
  const burn = -m.rev * m.margin / 100;
  if (burn <= 0) return null;
  return Math.max(0, m.cash / burn * 12);
}
function valuation(m){
  let mult = 1 + Math.max(0, m.growth)/8 + (m.margin >= 0 ? m.margin/10 : Math.max(m.margin/40, -3)) + (m.rep-50)/50 + (m.sat-50)/100 - Math.max(0, m.debt-50)/50;
  mult = clamp(mult, .4, 25);
  return m.rev * mult + Math.max(0, m.cash);
}

/* ---------- AI bridge: talks to the server in server.js, which calls Groq or any OpenAI-compatible provider ---------- */
const CODE_KEY = 'thechair.accesscode';
const AI = { model:'', needsCode:false };
function getCode(){ try { return localStorage.getItem(CODE_KEY) || ''; } catch(e){ return ''; } }
function setCode(v){ try { localStorage.setItem(CODE_KEY, v.trim()); } catch(e){} }
function parseLoose(t){
  try { return JSON.parse(t); } catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f){ try { return JSON.parse(f[1]); } catch(e){} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b+1)); } catch(e){} }
  return undefined;
}
function makeSampler(){
  async function call(input, opts, json){
    opts = opts || {};
    const messages = typeof input === 'string' ? [{ role:'user', content:input }] : input;
    if (opts.signal && opts.signal.aborted) throw { code:'cancelled' };
    let res, data = {};
    try {
      res = await fetch('/api/llm', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Access-Code':getCode() },
        body:JSON.stringify({ messages, json, tier: opts.modelTier === 'quick' ? 'quick' : 'default' }),
        signal:opts.signal
      });
      data = await res.json().catch(() => ({}));
    } catch(e){
      if (opts.signal && opts.signal.aborted) throw { code:'cancelled' };
      throw { code:'upstream_error' };
    }
    if (opts.signal && opts.signal.aborted) throw { code:'cancelled' };
    if (!res.ok) throw { code: data.error || (res.status === 429 ? 'rate_limited' : 'upstream_error'), message: data.message || '' };
    const text = String(data.text || '');
    if (!text.trim()) throw { code:'empty_completion' };
    if (opts.onText){ try { opts.onText({ text, delta:text }); } catch(e){} }
    return { text, truncated: !!data.truncated };
  }
  const fn = (input, opts) => call(input, opts, false);
  fn.json = async (input, opts) => {
    const { text, truncated } = await call(input, opts, true);
    const v = parseLoose(text);
    if (v === undefined || (truncated && typeof v !== 'object')) throw { code:'invalid_json', text };
    return v;
  };
  return fn;
}

/* ---------- Time ---------- */
function periodLabel(t){
  const tf = TFS[S.tf];
  if (tf.unit === 'quarter') return `Year ${Math.floor(t/4)+1}, quarter ${t%4+1}`;
  if (tf.unit === 'half') return `Year ${Math.floor(t/2)+1}, ${t%2 ? 'second' : 'first'} half`;
  return `Year ${t+1}`;
}
function dur(n){
  const months = Math.round(n * TFS[S.tf].p * 12);
  if (months < 12) return months + ' months';
  const y = months / 12;
  return y === 1 ? 'a year' : (Number.isInteger(y) ? y + ' years' : y.toFixed(1) + ' years');
}

/* ---------- Mechanics ---------- */
function applyEffects(e, m){
  for (const k in (e || {})){
    const v = e[k]; if (!v) continue;
    if (k === 'rev') m.rev = Math.max(.01, m.rev * (1 + v/100));
    else if (k === 'cash') m.cash += v/100 * Math.max(Math.abs(m.cash), m.rev*.5, S.start.cash*.5);
    else if (k === 'growth') m.growth = clamp(m.growth + v, -60, 250);
    else if (k === 'margin') m.margin = clamp(m.margin + v, -400, 60);
    else if (k === 'staff') m.staff = Math.max(1, Math.round(m.staff * (1 + v/100)));
    else if (k in m) m[k] = clamp(m[k] + v, 0, 100);
  }
}
function natural(){
  const m = S.m, p = TFS[S.tf].p, b = SIZES[S.size].base, notes = [];
  m.rev *= 1 + m.growth/100 * p;
  m.cash += m.rev * m.margin/100 * p;
  if (m.margin < 0) m.margin += -m.margin * .3 * p;
  m.growth += (b - m.growth) * .12;
  for (const k of ['morale','sat','rep']) m[k] += (55 - m[k]) * .08;
  m.debt = clamp(m.debt + 6*p, 0, 100);
  if (m.debt > 75){ m.growth -= 2; m.sat -= 2; m.morale -= 2; notes.push('Heavy tech debt is slowing every release and frustrating customers.'); }
  if (m.morale < 30){ m.staff = Math.round(m.staff*.97); m.growth -= 2; notes.push('Morale is low, and good people are quitting.'); }
  if (m.sat < 30){ m.rev *= .97; notes.push('Unhappy customers are cancelling.'); }
  m.board += clamp((m.growth - b)/8, -3, 3);
  const rw = runway(m);
  if (rw !== null && rw < 6){ m.board -= 5; notes.push('With under six months of cash left, the board is alarmed.'); }
  m.staff = Math.max(1, Math.round(m.staff * (1 + Math.max(0, m.growth)/100 * p * .4)));
  for (const k of ['morale','sat','rep','board']) m[k] = clamp(m[k], 0, 100);
  return notes;
}

function newGame(d){
  const sz = SIZES[d.size], tf = TFS[d.tf];
  const domain = d.domain === 'Other' ? (d.customDomain.trim() || 'General business') : d.domain;
  const m = { rev:sz.rev, cash:sz.cash, growth:sz.growth, margin:sz.margin, staff:sz.staff, morale:sz.morale, sat:sz.sat, debt:sz.debt, rep:sz.rep, board:sz.board };
  S = {
    v:1, role:d.role, domain, size:d.size, tf:d.tf, name:d.name.trim() || NAMES[Math.floor(Math.random()*NAMES.length)],
    source: (d.source === 'ai' && sample) ? 'ai' : 'bank',
    total: tf.turns, turn:0, m, start:copy(m), mark:copy(m), markPrev:copy(m),
    pending:[], log:[], styles:{}, terms:{}, landed:[], drift:[],
    bankOrder: shuffle(BANK.map((_,i)=>i)), bankUsed:[],
    scenario:null, outcome:null, phase:'loading', error:null, notice:null,
    customDraft:'', customError:null, mentorOpen:false, mentorDraft:''
  };
  save();
  loadScenario();
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function pickBank(){
  const avail = S.bankOrder.filter(i => !S.bankUsed.includes(i));
  const pool = avail.length ? avail : S.bankOrder.slice();
  const rw = runway(S.m);
  let idx = pool[0];
  const prefer = id => pool.find(i => BANK[i].id === id);
  if (rw !== null && rw < 10 && prefer('capital') !== undefined) idx = prefer('capital');
  else if (S.m.debt > 70 && prefer('rewrite') !== undefined) idx = prefer('rewrite');
  S.bankUsed.push(idx);
  const b = BANK[idx], fill = t => t.replaceAll('{co}', S.name);
  return {
    src:'bank', type:b.type, title:b.title,
    situation:b.situation.map(fill), stakeholders:b.stakeholders.slice(),
    glossary:b.glossary.map(([term,meaning]) => ({term, meaning})),
    analogy:b.analogy, caseStudy:b.caseStudy,
    options:b.levers ? [] : b.options.map(x => ({...copy(x), detail:fill(x.detail)})),
    levers:b.levers ? copy(b.levers) : null, combos:b.combos ? copy(b.combos) : [], lesson:b.lesson || '',
    mentor:[]
  };
}

function setScenario(sc){
  S.scenario = sc; S.phase = 'scenario'; S.error = null;

  S.customDraft = ''; S.customError = null; S.mentorOpen = false; S.mentorDraft = ''; S.leverPick = {};

  save(); render(); window.scrollTo({top:0});

const FATAL = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','not_configured','bad_key'];
function errCopy(e){
  const c = e && e.code;
  if (c === 'rate_limited') return 'You’ve reached a usage limit for now. Wait a little and try again, or use a built-in scenario.';
  if (c === 'needs_code') return 'This game is protected by an access code. Enter the code below, then try again.';
  if (c === 'too_large') return 'That request was too long. Shorten your text and try again.';
  if (c === 'refused') return 'The AI declined to write that one. Try again, or use a built-in scenario.';
  if (c === 'invalid_json' || c === 'empty_completion' || c === 'bad_shape') return 'The response came back incomplete. Try again.';
  return 'Couldn’t reach the AI server. If it was asleep, it may need a minute to wake up. Try again shortly.';
}

async function loadScenario(){
  S.phase = 'loading'; S.error = null; render();
  if (S.source !== 'ai' || !sample){ setScenario(pickBank()); return; }
  const ctl = new AbortController();
  busy = { kind:'scenario', ctl, t0:Date.now(), chars:0, toBank:false };
  render();
  try {
    const j = await sample.json(scenarioPrompt(), { signal:ctl.signal, onText:({text}) => { if (busy) busy.chars = text.length; } });
    const sc = normScenario(j);
    busy = null;
    setScenario(sc);
  } catch(e){
    const toBank = busy && busy.toBank;
    busy = null;
    if (e && e.code === 'cancelled'){ if (toBank) setScenario(pickBank()); return; }
    if (e && FATAL.includes(e.code)){
      S.source = 'bank';
      S.notice = 'The AI server isn’t set up correctly (check its API key), so the game switched to the built-in scenario library.';
      setScenario(pickBank()); return;
    }
    S.phase = 'error'; S.error = errCopy(e); S.errorCode = e && e.code; save(); render();
  }
}

function normE(e){
  const out = {};
  if (!e || typeof e !== 'object') return out;
  for (let k in e){
    const key = ALIAS[k] || k;
    if (!RANGES[key]) continue;
    const v = Number(e[k]);
    if (!Number.isFinite(v)) continue;
    const r = Math.round(clamp(v, RANGES[key][0], RANGES[key][1]));
    if (r) out[key] = r;
  }
  return out;
}
const normH = h => ({ note: str(h && h.note, ''), e: normE(h && (h.effects || h.e)) });
function normOpt(x){
  if (!x || typeof x !== 'object') throw {code:'bad_shape'};
  return { label:str(x.label,'Unnamed option'), detail:str(x.detail,''), style:STYLES[x.style] ? x.style : 'bold',
    short:normH(x.short), medium:normH(x.medium), long:normH(x.long), lesson:str(x.lesson,''), feedback:str(x.feedback,'') };
}
function normScenario(j){
  if (!j || !Array.isArray(j.options) || j.options.length < 2) throw {code:'bad_shape'};
  let sit = j.situation;
  sit = Array.isArray(sit) ? sit.map(String).filter(Boolean) : String(sit || '').split(/\n\s*\n/).filter(Boolean);
  const cs = j.caseStudy && typeof j.caseStudy === 'object' && str(j.caseStudy.summary,'') ? { company:str(j.caseStudy.company,'A real company'), year:str(String(j.caseStudy.year||''),''), summary:str(j.caseStudy.summary,'') } : null;
  return {
    src:'ai', type:str(j.type,'Strategy'), title:str(j.title,'A decision lands on your desk'),
    situation:sit, stakeholders:Array.isArray(j.stakeholders) ? j.stakeholders.map(String).slice(0,4) : [],
    glossary:Array.isArray(j.glossary) ? j.glossary.filter(g => g && g.term).map(g => ({term:String(g.term), meaning:String(g.meaning||'')})).slice(0,8) : [],
    analogy:str(j.analogy,''), caseStudy:cs,
    options:j.options.slice(0,4).map(normOpt), mentor:[]
  };
}

/* ---------- Prompts ---------- */
const EFFECT_SPEC = `Effects are changes, using only these keys (leave out any that don't change):
rev: % change to yearly revenue (-20 to 20)
cash: % change to cash reserves (-50 to 60)
growth: change to the yearly revenue growth rate, in percentage points (-10 to 10)
margin: change to profit margin, in percentage points (-10 to 10)
staff: % change to headcount (-25 to 15)
morale, sat (customer satisfaction), rep (reputation), board (board confidence): points on a 0-100 scale (-20 to 20)
debt: tech debt points on a 0-100 scale; positive means MORE debt, which is bad (-25 to 20)
Keep magnitudes realistic for a company this size; most single effects should be under 10.`;

  return `Company: ${S.name}, a ${sz.label.toLowerCase()} company in ${S.domain} (it started as ${sz.desc}).
Player role: ${ROLES[S.role].full}.
Timeline: ${S.total} decisions over ${tf.label}; each decision covers ${dur(1)}. Now at decision ${S.turn+1} (${periodLabel(S.turn)}).
Current numbers: yearly revenue ${money(m.rev)}; cash ${money(m.cash)}; ${rw === null ? 'profitable, not burning cash' : 'runway about ' + Math.round(rw) + ' months'}; revenue growth ${m.growth.toFixed(1)}% per year; profit margin ${m.margin.toFixed(1)}%; headcount ${num(m.staff)}; team morale ${Math.round(m.morale)}/100; customer satisfaction ${Math.round(m.sat)}/100; tech debt ${Math.round(m.debt)}/100 (higher is worse); reputation ${Math.round(m.rep)}/100; board confidence ${Math.round(m.board)}/100.

${recent}

The player is learning, so write in plain, concrete language. The first time you use any business or technical term, abbreviation or jargon verb (for example "churn", "ARR", "to vest", "to refactor"), briefly explain it in the text and add it to "glossary" with a one-sentence plain meaning.

${brief()}

Write decision ${S.turn+1} of ${S.total}. Make it a genuine dilemma specific to a ${SIZES[S.size].label.toLowerCase()} ${S.domain} company at this moment, reacting to the numbers and earlier decisions where it makes sense (if runway is under 9 months, cash should be at stake; if tech debt is above 65, it should bite; if a pending consequence is about to land, you may build on it). Choose a type different from the recent ones (${recentTypes}) from: ${TYPES.join(', ')}. Later decisions can carry bigger stakes.

${EFFECT_SPEC}

Reply with only JSON in this shape:

/* ---------- Decisions ---------- */

function optionsText(sc){
  if (sc.levers) return sc.levers.map(L => `${L.name} (${L.choices.map(c => c.label).join(' / ')})`).join('; ') + '. The player sets every lever at once.';
  return sc.options.map(x => x.label).join('; ');
}
function addE(t, e){ for (const k in (e || {})) t[k] = (t[k] || 0) + e[k]; return t; }

function resolveLevers(){
  const sc = S.scenario, tf = TFS[S.tf], t = S.turn, pick = S.leverPick || {};
  const picks = sc.levers.map((L, i) => ({ name:L.name, i, j:pick[i], c:L.choices[pick[i]] }));
  if (picks.some(p => !p.c)) return;
  const matched = (sc.combos || []).filter(c => Object.entries(c.when).every(([li, ci]) => pick[li] === ci));
  const H = {};
  for (const h of ['short','medium','long']){
    const e = {}, notes = [];
    picks.forEach(p => { addE(e, p.c[h].e); if (p.c[h].note) notes.push(p.c[h].note); });
    matched.filter(m => m.h === h).forEach(m => addE(e, m.e));
    for (const k in e){ e[k] = Math.round(e[k]); if (!e[k]) delete e[k]; }
    H[h] = { notes, e };
  }
  applyEffects(H.short.e, S.m);
  const mk = h => H[h].notes.concat(matched.filter(m => m.h === h).map(m => m.note)).join(' ');
  S.pending.push({ due:t+tf.med,  h:'medium', e:H.medium.e, note:mk('medium') || 'Your plan settles in.', from:sc.title });
  S.pending.push({ due:t+tf.long, h:'long',   e:H.long.e,   note:mk('long') || 'The long-term effects of your plan play out.', from:sc.title });
  const counts = {};
  picks.forEach(p => { S.styles[p.c.style] = (S.styles[p.c.style] || 0) + 1; counts[p.c.style] = (counts[p.c.style] || 0) + 1; });
  const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
  S.log.push({ when:periodLabel(t), type:sc.type, title:sc.title, choice:picks.map(p => `${p.name}: ${p.c.label}`).join('; '), style:top, custom:false });
  S.outcome = { levers:true, picks:picks.map(p => ({ name:p.name, label:p.c.label, i:p.i, j:p.j })), H, matched };
  S.phase = 'outcome';
  save(); render();
  const st = $('.stage'); if (st) st.scrollIntoView({block:'start'});
}

function leversHTML(sc){
  const pick = S.leverPick || {}, set = sc.levers.filter((_, i) => pick[i] !== undefined).length;
  return `<p class="lever-intro">Set every lever, then commit your plan. The levers act together, and some combinations help or hurt each other.</p>
    ${sc.levers.map((L, i) => `<fieldset class="lever"><legend>${esc(L.name)}</legend><div class="seg">${L.choices.map((c, j) => `<button class="segbtn" data-act="lever" data-l="${i}" data-c="${j}" aria-pressed="${pick[i] === j}">${esc(c.label)}</button>`).join('')}</div></fieldset>`).join('')}
    <div class="commitrow"><button class="btn" data-act="commitlevers" ${set === sc.levers.length ? '' : 'disabled'}>Commit this plan</button><span class="muted small">${set} of ${sc.levers.length} levers set</span></div>`;
}

  const sc = S.scenario, O = S.outcome, tf = TFS[S.tf];
  const lastTurn = S.turn + 1 >= S.total;

  return `

    <ul class="plan">${O.picks.map(p => `<li><span>${esc(p.name)}</span><b>${esc(p.label)}</b></li>`).join('')}</ul>
    <div class="wave now"><h4>Right away</h4>${notes(O.H.short.notes)}${chips(O.H.short.e)}</div>
    <div class="wave med"><h4>${when(tf.med)}</h4>${notes(O.H.medium.notes)}<p class="sealed">The combined effects are revealed when this lands.</p></div>
    <div class="wave long"><h4>${when(tf.long)}</h4>${notes(O.H.long.notes)}<p class="sealed">${S.turn + tf.long >= S.total ? 'This lands after your tenure. It still counts toward your legacy score.' : 'The combined effects are revealed when this lands.'}</p></div>
    ${O.matched.length ? `<div class="combo"><h4>How your choices interacted</h4>${O.matched.map(m => `<p><span class="when">${hl[m.h]}</span>${esc(m.note)}</p>`).join('')}</div>` : `<div class="combo"><h4>How your choices interacted</h4><p>No strong interactions this time. Each lever worked on its own.</p></div>`}
    ${sc.lesson ? `<div class="lesson"><h4>The lesson</h4><p>${esc(sc.lesson)}</p></div>` : ''}
    ${sc.caseStudy ? `<div class="case"><h4>Case study: ${esc(sc.caseStudy.company)}${sc.caseStudy.year ? ` (${esc(sc.caseStudy.year)})` : ''}</h4><p>${esc(sc.caseStudy.summary)}</p></div>` : ''}
    <details class="paths"><summary>The other settings you could have chosen</summary>
      ${sc.levers.map((L, i) => L.choices.filter((_, j) => j !== O.picks[i].j).map(c => `<div class="path"><p><span class="muted">${esc(L.name)}:</span> <b>${esc(c.label)}</b></p>${['short','medium','long'].filter(h => c[h].note).map(h => `<p><span class="muted">${hl[h]}:</span> ${esc(c[h].note)}</p>`).join('')}</div>`).join('')).join('')}
      ${(sc.combos || []).filter(c => !O.matched.includes(c) && !O.matched.some(m => m.note === c.note)).length ? `<div class="path"><p><b>Combinations you didn’t trigger</b></p>${sc.combos.filter(c => !O.matched.some(m => m.note === c.note)).map(c => `<p>${esc(Object.entries(c.when).map(([li, ci]) => sc.levers[li].choices[ci].label).join(' + '))}: ${esc(c.note)}</p>`).join('')}</div>` : ''}
    </details>

function resolveDecision(opt, custom){
  const tf = TFS[S.tf], t = S.turn;
  applyEffects(opt.short.e, S.m);
  S.pending.push({ due:t+tf.med,  h:'medium', e:opt.medium.e, note:opt.medium.note, from:opt.label });
  S.pending.push({ due:t+tf.long, h:'long',   e:opt.long.e,   note:opt.long.note,   from:opt.label });
  S.styles[opt.style] = (S.styles[opt.style] || 0) + 1;
  S.log.push({ when:periodLabel(t), type:S.scenario.type, title:S.scenario.title, choice:opt.label, style:opt.style, custom });
  S.outcome = { opt, custom };
  S.phase = 'outcome';
  save(); render();
  const st = $('.stage'); if (st) st.scrollIntoView({block:'start'});
}

async function commitCustom(){
  const text = (S.customDraft || '').trim();
  if (text.length < 15){ S.customError = 'Add a little more detail: what you’d do, who does it, and why.'; render(); return; }
  const ctl = new AbortController();
  busy = { kind:'eval', ctl, t0:Date.now(), chars:0 };
  S.phase = 'evaluating'; S.customError = null; render();
  try {
    const j = await sample.json(evalPrompt(text), { signal:ctl.signal, cache:false, onText:({text}) => { if (busy) busy.chars = text.length; } });
    busy = null;
    const opt = normOpt(j); opt.customText = text;
    resolveDecision(opt, true);
  } catch(e){
    busy = null;
    S.phase = 'scenario';
    if (e && FATAL.includes(e.code)){ S.source = 'bank'; S.customError = 'The AI server isn’t available, so choose one of the options above.'; }
    else if (!(e && e.code === 'cancelled')) S.customError = errCopy(e);
    render();
  }
}

async function askMentor(){
  const q = (S.mentorDraft || '').trim();
  if (!q || !sample) return;
  const sc = S.scenario;
  const item = { q, a:'', state:'pending' };
  sc.mentor.push(item); S.mentorDraft = ''; S.mentorOpen = true; render();
  const idx = sc.mentor.length - 1;
  try {
    const { text } = await sample(mentorPrompt(q), { modelTier:'quick', cache:false, onText:({text}) => {
      item.a = text; const el = document.getElementById('ma-' + idx); if (el) el.textContent = text;
    }});
    item.a = text; item.state = 'done';
  } catch(e){
    item.a = (e && e.text) || ''; item.state = 'error'; item.err = errCopy(e);
  }
  save(); if (S.phase === 'scenario') render();
}

function advance(){
  S.drift = natural();
  S.turn++;
  bridgeIfPossible();
  if (S.m.cash <= 0) return endGame('cash');
  if (S.turn >= S.total) return endGame(null);
  S.landed = [];
  S.pending = S.pending.filter(p => {
    if (p.due <= S.turn){ applyEffects(p.e, S.m); S.landed.push(p); return false; }
    return true;
  });
  bridgeIfPossible();
  if (S.m.cash <= 0) return endGame('cash');
  if (S.m.board <= 12) return endGame('board');
  S.outcome = null;
  loadScenario();
}

function bridgeIfPossible(){
  const m = S.m;
  if (m.cash > 0 || (S.bridges || 0) >= 2 || m.board < 30) return;
  const burn = Math.max(-m.rev * m.margin / 100, m.rev * .1);
  m.cash = burn * .75;
  m.board = clamp(m.board - 14, 0, 100); m.morale = clamp(m.morale - 6, 0, 100);
  S.bridges = (S.bridges || 0) + 1;
  S.terms['Bridge round'] = BASE_TERMS['Bridge round'];
  (S.drift = S.drift || []).push(`Cash hit zero. Investors put in an emergency bridge round on harsh terms, enough for about nine months. Board confidence fell sharply.${S.bridges >= 2 ? ' They’ve said there won’t be another one.' : ''}`);
}

function endGame(reason){
  S.over = reason; S.phase = 'end';
  S.valueStart = valuation(S.start);
  S.valueExit = valuation(S.m);
  const lm = copy(S.m);
  S.pending.forEach(p => applyEffects(p.e, lm));
  S.legacyM = lm; S.valueLegacy = valuation(lm);
  S.review = null; S.reviewState = null;
  save(); render(); window.scrollTo({top:0});
  requestReview();
}

async function requestReview(){
  if (S.source !== 'ai' || !sample){ S.review = localReview(); S.reviewState = 'local'; save(); render(); return; }
  S.reviewState = 'pending'; render();
  try {
    const { text } = await sample(reviewPrompt(), { onText:({text}) => {
      S.review = text; const el = $('#review'); if (el) el.innerHTML = reviewHTML(text);
    }});
    S.review = text; S.reviewState = 'done';
  } catch(e){
    S.review = localReview(); S.reviewState = 'local';
  }
  save(); render();
}

function localReview(){
  const s = S.start, m = S.m;
  const top = Object.entries(S.styles).sort((a,b) => b[1]-a[1])[0];
  const exitCh = (S.valueExit/S.valueStart - 1) * 100, legCh = (S.valueLegacy/S.valueExit - 1) * 100;
  const changes = ['morale','sat','rep','board'].map(k => [k, m[k]-s[k]]).sort((a,b) => b[1]-a[1]);
  const nice = { morale:'team morale', sat:'customer satisfaction', rep:'reputation', board:'board confidence' };
  const out = [];
  out.push(`Overall: You left ${S.name} with an estimated value ${exitCh >= 0 ? 'up' : 'down'} ${Math.abs(exitCh).toFixed(0)}% from where you started. ${S.over === 'cash' ? 'The company ran out of cash, which ends most stories regardless of how good the strategy was.' : S.over === 'board' ? 'The board lost confidence and replaced you, a reminder that results and trust both have to be managed.' : 'You finished the full term.'}`);
  out.push(`Strengths: Your most common instinct was ${top ? STYLES[top[0]].toLowerCase() : 'balanced'}. Your biggest gain was in ${nice[changes[0][0]]} (${sgn(changes[0][1])} points).`);
  out.push(`Blind spots: ${nice[changes[3][0]]} moved ${sgn(changes[3][1])} points. ${m.debt - s.debt > 10 ? 'Tech debt also climbed noticeably, which quietly taxes every future plan.' : ''} ${legCh < 0 ? `After you left, your pending decisions knocked about ${Math.abs(legCh).toFixed(0)}% off the company’s value: some wins were borrowed from the future.` : `After you left, your long-term bets added about ${legCh.toFixed(0)}% to the company’s value: you planted trees others will sit under.`}`);
  out.push('Practice next: Before each big call, write down what you expect to happen in six months and in two years, then check back. It’s like keeping a training log at the gym: you only improve what you measure. Second, study “second-order effects,” the consequences of the consequences, by asking “and then what?” at least twice.');
  return out.join('\n\n');
}

/* ---------- Rendering ---------- */
function chips(e){
  const ks = Object.keys(e || {}).filter(k => e[k] && EK[k]);
  if (!ks.length) return '<p class="sealed">No measurable change.</p>';
  return '<ul class="chips">' + ks.map(k => {
    const v = e[k], good = k === 'debt' ? v < 0 : v > 0, [name,u] = EK[k];
    return `<li class="chip ${good ? 'good' : 'bad'}">${name} ${v > 0 ? '+' : '−'}${Math.abs(v)}${u}</li>`;
  }).join('') + '</ul>';
}

function renderNav(){
  const nav = $('#topnav');
  if (!S || S.phase === 'setup'){ nav.innerHTML = `<button class="link" data-act="glossary">Glossary</button>`; return; }
  nav.innerHTML = `<button class="link" data-act="glossary">Glossary</button><button class="link" data-act="log">Decisions</button>` +
    (S.phase === 'end' ? '' : `<button class="link ${newGameArmed > Date.now() ? 'warn' : ''}" data-act="newgame">${newGameArmed > Date.now() ? 'Tap again to quit' : 'New game'}</button>`);
}

function render(){
  renderNav();
  if (!S || S.phase === 'setup') return renderSetup();
  if (S.phase === 'end') return renderEnd();
  renderGame();
}

function renderSetup(){

  const saved = loadSave();
  const aiOn = aiStatus === 'on';
  const sel = (k,v) => draft[k] === v ? 'true' : 'false';
  app.innerHTML = `
  <section class="hero">
